<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0a2129">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AYKS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AYKS Analyser – Eurojackpot & Lotto 6aus49</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1ef; --panel:#fbfcfb; --ink:#14212b; --muted:#5d6b73; --line:#d5dcd8;
  --teal:#1f7a6e; --teal-soft:#cfe6e1; --amber:#d98a1c; --red:#d4232c;
  --ball-lotto:#f5c43d; --ball-euro:#e39a2a; --ball-main:#ffffff;
  --font:"Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#121a1f; --panel:#18222a; --ink:#e7eef0; --muted:#97a6ad; --line:#2a3741; --teal:#4fb7a6; --teal-soft:#1d3d39; --ball-main:#e9eef0; }
}
:root[data-theme="dark"]{ --bg:#121a1f; --panel:#18222a; --ink:#e7eef0; --muted:#97a6ad; --line:#2a3741; --teal:#4fb7a6; --teal-soft:#1d3d39; --ball-main:#e9eef0; }
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
.wrap{max-width:1160px;margin:0 auto;padding:0 clamp(14px,3vw,28px)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:18px;height:62px}
.logo{font-weight:800;font-stretch:115%;letter-spacing:-.02em;font-size:19px;white-space:nowrap}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.nav{margin-left:auto;display:flex;gap:18px;font-size:14px}
.nav a{color:var(--muted);text-decoration:none}.nav a:hover{color:var(--ink)}
@media (max-width:900px){.nav{display:none}.bar .wrap{justify-content:space-between}}

/* hero */
.hero{padding:34px 0 10px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:28px;align-items:start}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.next h1{font-stretch:118%;font-weight:800;font-size:clamp(30px,4.2vw,52px);line-height:1;letter-spacing:-.03em;margin:6px 0 10px}
.next .when{font-size:18px;color:var(--muted);margin:0 0 18px}
.count{display:flex;gap:10px;margin-bottom:18px}
.count div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:66px;text-align:center}
.count b{display:block;font-size:24px;font-weight:700;font-stretch:110%}
.count span{font-size:12px;color:var(--muted)}
.lastdraw{font-size:14px;color:var(--muted)}
.lastdraw .balls{margin-top:6px}
.truth{margin-top:20px;border-left:3px solid var(--teal);padding:2px 0 2px 14px;font-size:15px;color:var(--muted);max-width:56ch}
.truth b{color:var(--ink)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,2.4vw,24px)}
.picks-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px}
.picks-head h2{margin:0;font-size:20px;letter-spacing:-.01em}
select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 13px;font-size:14px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stratinfo{font-size:14px;color:var(--muted);margin:0 0 14px}
.tip{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.tip .idx{color:var(--muted);font-size:13px}
.tip .meta{font-size:12px;color:var(--muted);margin-top:4px}
.pop{text-align:right;font-size:12px;color:var(--muted);min-width:84px}
.pop b{display:block;font-size:18px;color:var(--ink)}
.pop i{display:block;height:5px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
.pop i s{display:block;height:100%;background:var(--teal)}

/* balls */
.balls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ball{--c:var(--ball-main);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:#14212b;
  background:radial-gradient(circle at 34% 28%,#fff 0%,var(--c) 42%,color-mix(in srgb,var(--c) 70%,#000) 100%);
  box-shadow:inset 0 -2px 4px rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.2)}
.ball.main-ej{--c:#f4f2ec;border:0}
.ball.lotto{--c:var(--ball-lotto)}
.ball.euro{--c:var(--ball-euro)}
.ball.sz{--c:var(--red);color:#fff}
.ball.sm{width:28px;height:28px;font-size:13px}
.plus{color:var(--muted);font-size:13px;margin:0 2px}

/* sections */
section.s{padding:44px 0 6px}
section.s>h2{font-size:clamp(24px,2.6vw,32px);font-stretch:112%;letter-spacing:-.02em;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 18px;max-width:72ch}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.grid-heat{display:grid;gap:5px}
.cell{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:var(--panel);font-weight:700;font-size:15px;position:relative;padding:0}
.cell small{font-weight:500;font-size:10.5px;opacity:.8}
.cell.sel{outline:2.5px solid var(--ink);outline-offset:1px}
.heatwrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px}
@media (max-width:900px){.heatwrap{grid-template-columns:1fr}}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{flex:1;max-width:180px;height:8px;border-radius:4px}
.detail h3{margin:0 0 10px;font-size:18px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;text-align:right}
.toplists{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.toplists h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.chart h3{margin:0 0 4px;font-size:16px}
.chart p{margin:0 0 12px;font-size:13px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;border-bottom:1px solid var(--line)}
.bars .b{flex:1;position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center}
.bars .o{width:58%;background:var(--teal);border-radius:4px 4px 0 0}
.bars .t{position:absolute;left:12%;right:12%;border-top:2px dashed var(--amber)}
.bars .lab{display:flex;gap:6px;font-size:11px;color:var(--muted);margin-top:4px}
.bars+.labs{display:flex;gap:6px;font-size:11px;color:var(--muted);margin-top:4px}
.labs span{flex:1;text-align:center}
.keyrow{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.keyrow i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.verdict{display:flex;gap:12px;align-items:flex-start}
.verdict .p{white-space:nowrap;font-size:26px;font-weight:800;font-stretch:115%;line-height:1}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
.ticket{display:grid;gap:4px;max-width:420px}
.ticket button{aspect-ratio:1;border:1px solid var(--line);background:var(--bg);border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;padding:0}
.ticket button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ticket.euro button[aria-pressed="true"]{background:var(--ball-euro);color:#14212b;border-color:var(--ball-euro)}
.checkgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
@media (max-width:800px){.checkgrid{grid-template-columns:1fr}}
.note{font-size:13px;color:var(--muted)}
.addform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.addform input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:14px}
.warn{background:color-mix(in srgb,var(--amber) 16%,var(--panel));border:1px solid color-mix(in srgb,var(--amber) 45%,var(--line));border-radius:12px;padding:10px 14px;font-size:14px;margin-top:14px}
footer{margin-top:50px;border-top:1px solid var(--line);padding:24px 0 40px;font-size:13px;color:var(--muted)}
footer p{margin:0 0 8px;max-width:90ch}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:no-preference){.ball.pop-in{animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}}
@keyframes pop{from{transform:scale(.4);opacity:0}}

.logo{display:flex;align-items:baseline;gap:6px}
.logo em{font-style:normal;font-weight:500;font-stretch:100%;font-size:13px;color:var(--muted);letter-spacing:.06em}
.lang{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;margin-left:12px}
.lang button{border:0;background:none;padding:6px 10px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13px}
.lang button[aria-pressed="true"]{background:var(--teal);color:#fff}
@media (max-width:900px){.lang{margin-left:0}.bar .wrap{gap:10px}.logo em{display:none}}
@media (max-width:520px){.logo{font-size:16px}.seg button{padding:7px 10px;font-size:13px}}

/* ===== INTRO ===== */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;color:#fff;
  background:radial-gradient(120% 90% at 50% 40%,#0f3a3c 0%,#0a2129 45%,#050e14 100%);
  transition:opacity .7s ease, transform .9s cubic-bezier(.7,0,.2,1)}
#intro.out{opacity:0;transform:scale(1.08);pointer-events:none}
#intro .grid{position:absolute;inset:-50%;background-image:linear-gradient(rgba(79,183,166,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(79,183,166,.09) 1px,transparent 1px);background-size:44px 44px;transform:perspective(600px) rotateX(58deg) translateY(10%);animation:gridMove 6s linear infinite}
@keyframes gridMove{to{background-position:0 44px,44px 0}}
.intro-stage{position:relative;width:min(760px,92vw);text-align:center;z-index:3;transform:translateZ(0)}
#money{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.intro-title{font-family:var(--font);font-weight:800;font-stretch:125%;line-height:.9;margin:0;letter-spacing:-.02em}
.intro-title .ayks{display:block;font-size:clamp(64px,15vw,150px);filter:drop-shadow(0 8px 30px rgba(245,196,61,.35))}
.intro-title .ayks span{background:linear-gradient(180deg,#fff7d6 0%,#f5c43d 48%,#c98a16 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.intro-title .an{display:block;font-size:clamp(20px,4.6vw,44px);letter-spacing:.42em;margin-top:8px;color:#cfeee8;padding-left:.42em}
.intro-title span span{display:inline-block;opacity:0;transform:translateY(40px) rotateX(70deg);animation:letter .7s cubic-bezier(.2,1.2,.3,1) forwards}
@keyframes letter{to{opacity:1;transform:none}}
.intro-sub{margin:16px 0 0;color:#9fc7c0;font-size:clamp(14px,1.6vw,17px);opacity:0;animation:fadeUp .8s 1.5s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.intro-chart{display:block;width:100%;height:auto;margin:6px auto 0;overflow:visible}
.intro-chart .bar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .9s cubic-bezier(.2,1.1,.3,1) forwards}
@keyframes grow{to{transform:scaleY(1)}}
.intro-chart .line{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.8s .5s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.intro-chart .area{opacity:0;animation:fadeIn 1s 1.6s forwards}
@keyframes fadeIn{to{opacity:1}}
.intro-chart .dot{opacity:0;animation:fadeIn .3s 2.2s forwards}
.intro-chart .pulse{transform-box:fill-box;transform-origin:center;opacity:0;animation:pulse 1.4s 2.2s ease-out infinite}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
.intro-count{display:flex;justify-content:center;gap:clamp(18px,5vw,48px);margin-top:16px;opacity:0;animation:fadeUp .8s 1.9s forwards}
.intro-count div{text-align:center}
.intro-count b{display:block;font-size:clamp(22px,3.4vw,34px);font-weight:800;font-stretch:115%;color:#f5c43d;font-variant-numeric:tabular-nums}
.intro-count span{font-size:12px;color:#8fb5ae}
.intro-balls{display:flex;justify-content:center;gap:8px;margin-top:18px}
.intro-balls .ball{opacity:0;animation:ballIn .6s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes ballIn{from{opacity:0;transform:translateY(-60px) scale(.5)}to{opacity:1;transform:none}}
.coin{position:absolute;top:-80px;z-index:1;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;font-weight:800;color:#7a520b;font-size:calc(var(--s)*.5);
  background:radial-gradient(circle at 35% 30%,#fff3c4,#f5c43d 45%,#b77d12 100%);box-shadow:inset 0 0 0 3px rgba(122,82,11,.35),0 6px 14px rgba(0,0,0,.4);
  animation:fall var(--d) var(--delay) linear forwards}
@keyframes fall{0%{transform:translate3d(0,0,0) rotateY(0) rotateZ(0);opacity:0}8%{opacity:1}100%{transform:translate3d(var(--dx),115vh,0) rotateY(1080deg) rotateZ(var(--rz));opacity:.9}}
.note-bill{position:absolute;top:-90px;z-index:1;width:74px;height:38px;border-radius:5px;background:linear-gradient(135deg,#7fd0a6,#2f8f68);box-shadow:0 6px 14px rgba(0,0,0,.35);display:grid;place-items:center;color:#0d3b29;font-weight:800;font-size:15px;
  animation:flutter var(--d) var(--delay) ease-in forwards}
.note-bill::before{content:"";position:absolute;inset:4px;border:1.5px solid rgba(13,59,41,.35);border-radius:3px}
@keyframes flutter{0%{transform:translate(0,0) rotate(0) rotateX(0);opacity:0}10%{opacity:1}50%{transform:translate(calc(var(--dx)*.5),55vh) rotate(160deg) rotateX(180deg)}100%{transform:translate(var(--dx),115vh) rotate(320deg) rotateX(360deg);opacity:.85}}
.intro-skip{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:3;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;backdrop-filter:blur(6px)}
.intro-progress{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,#4fb7a6,#f5c43d);width:0;animation:prog var(--dur,4.6s) linear forwards;z-index:3}
@keyframes prog{to{width:100%}}
.intro-disclaimer{position:absolute;left:18px;bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:3;font-size:12px;color:#6f938d;max-width:46ch;text-align:left}
@media (max-width:600px){.intro-disclaimer{display:none}}
@media (max-width:520px){.tip{grid-template-columns:20px 1fr;gap:8px}.tip .pop{grid-column:2;text-align:left;display:flex;align-items:center;gap:8px;min-width:0}.tip .pop b{display:inline;font-size:15px}.tip .pop i{flex:1;max-width:120px;margin:0}.ball{width:32px;height:32px;font-size:14px}.balls{gap:5px}.count div{min-width:58px;padding:7px 8px}}
@media (prefers-reduced-motion:reduce){#intro *{animation-duration:.01s!important;animation-delay:0s!important}.coin,.note-bill{display:none}}
</style>
</head>
<body>
<div id="intro" role="dialog" aria-label="AYKS Analyser">
  <div class="grid" aria-hidden="true"></div>
  <div id="money" aria-hidden="true"></div>
  <div class="intro-stage">
    <svg class="intro-chart" viewBox="0 0 640 230" aria-hidden="true">
      <defs>
        <linearGradient id="ig" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f5c43d" stop-opacity=".45"/><stop offset="1" stop-color="#f5c43d" stop-opacity="0"/></linearGradient>
        <linearGradient id="ib" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#4fb7a6"/><stop offset="1" stop-color="#1f7a6e" stop-opacity=".2"/></linearGradient>
        <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <g id="introBars"></g>
      <path class="area" id="introArea" fill="url(#ig)"/>
      <path class="line" id="introLine" fill="none" stroke="#f5c43d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
      <circle class="pulse" id="introPulse" r="7" fill="#f5c43d"/>
      <circle class="dot" id="introDot" r="7" fill="#fff" stroke="#f5c43d" stroke-width="3"/>
    </svg>
    <h1 class="intro-title"><span class="ayks" id="tAyks"></span><span class="an" id="tAn"></span></h1>
    <p class="intro-sub" data-i18n="introSub"></p>
    <div class="intro-count">
      <div><b id="icDraws">0</b><span data-i18n="introDraws"></span></div>
      <div><b id="icNums">0</b><span data-i18n="introNums"></span></div>
      <div><b id="icTests">0</b><span data-i18n="introTests"></span></div>
    </div>
    <div class="intro-balls" id="introBalls"></div>
  </div>
  <p class="intro-disclaimer" data-i18n="introDisc"></p>
  <button class="intro-skip" id="skip" data-i18n="skip"></button>
  <div class="intro-progress"></div>
</div>

<div class="bar"><div class="wrap">
  <div class="logo">AYKS<em>ANALYSER</em></div>
  <div class="seg" role="group" data-i18n-aria="chooseGame">
    <button id="gEJ" aria-pressed="true">Eurojackpot</button>
    <button id="gLO" aria-pressed="false">Lotto 6aus49</button>
  </div>
  <nav class="nav">
    <a href="#tage" data-i18n="navDays"></a><a href="#haeufigkeit" data-i18n="navFreq"></a><a href="#muster" data-i18n="navPat"></a><a href="#chancen" data-i18n="navOdds"></a><a href="#pruefen" data-i18n="navCheck"></a><a href="#archiv" data-i18n="navArch"></a>
  </nav>
  <div class="lang" role="group" aria-label="Sprache / Dil">
    <button id="lDE" lang="de" aria-pressed="true" title="Deutsch">DE</button>
    <button id="lTR" lang="tr" aria-pressed="false" title="Türkçe">TR</button>
  </div>
</div></div>

<main class="wrap">
  <div class="hero">
    <div class="next">
      <div class="note" id="gameName"></div>
      <h1 id="nextTitle"></h1>
      <p class="when" id="nextWhen"></p>
      <div class="count" id="countdown"></div>
      <div class="lastdraw" id="lastDraw"></div>
      <p class="note" id="liveStatus" style="margin:10px 0 0;display:flex;gap:8px;align-items:center"></p>
      <div id="staleWarn"></div>
    </div>
    <div class="panel" id="picks">
      <div class="picks-head">
        <h2 id="picksTitle"></h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <label class="sr" for="strategy" data-i18n="strategy"></label>

async function fetchText(url){
  const c = new AbortController(), to = setTimeout(()=>c.abort(), 9000);
  try { const r = await fetch(url, { signal:c.signal, cache:'no-store' }); if (!r.ok) throw new Error('http'); return await r.text(); }

function parseCSV(txt, g){
  const GM = GAMES[g], out = [];
  txt.trim().split(/\r?\n/).slice(1).forEach(line => {
    const c = line.split(','); if (c.length !== 1+GM.K+GM.XK) return;
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(c[0]); if (!m) return;
    const d = +(m[1]+m[2]+m[3]); if (d <= SNAP[g]) return;
    const n = c.slice(1,1+GM.K).map(Number), x = c.slice(1+GM.K).map(Number);
    if (n.some(v=>!Number.isInteger(v)||v<1||v>GM.N) || new Set(n).size!==GM.K) return;
    if (x.some(v=>!Number.isInteger(v)||v<GM.xMin||v>GM.XN-1+GM.xMin)) return;
    out.push([d, ...n.sort((a,b)=>a-b), ...x]);

}

/* ---------- data ---------- */
function loadUser(){ try { return JSON.parse(localStorage.getItem('zl-add-'+G.key) || '[]'); } catch(e){ return []; } }
function saveUser(a){ try { localStorage.setItem('zl-add-'+G.key, JSON.stringify(a)); } catch(e){} }
function buildDraws(){
  const base = RAW[G.key].concat(LIVE[G.key]).map(r => ({ d:r[0], n:r.slice(1,1+G.K), x:r.slice(1+G.K), user:false }));
  const known = new Set(base.map(r=>r.d));
  const add = loadUser().filter(r=>!known.has(r.d)).map(r=>({ d:r.d, n:r.n, x:r.x, user:true }));
  draws = base.concat(add).sort((a,b)=>a.d-b.d);
}
const xDraws = () => draws.filter(r => r.d >= G.xFrom);

/* ---------- stats ---------- */
function stats(win){
  const ds = win ? draws.slice(-win) : draws;
  const f = Array(G.N+1).fill(0); ds.forEach(r=>r.n.forEach(n=>f[n]++));
  const xs = win ? xDraws().slice(-win) : xDraws();
  const xf = Array(G.XN+G.xMin).fill(0); xs.forEach(r=>r.x.forEach(n=>xf[n]++));
  const gap = Array(G.N+1).fill(draws.length);
  for (let i=draws.length-1;i>=0;i--) draws[i].n.forEach(n=>{ if (gap[n]===draws.length) gap[n]=draws.length-1-i; });
  const xd = xDraws(); const xgap = Array(G.XN+G.xMin).fill(xd.length);
  for (let i=xd.length-1;i>=0;i--) xd[i].x.forEach(n=>{ if (xgap[n]===xd.length) xgap[n]=xd.length-1-i; });
  return { ds, f, xs, xf, gap, xgap, exp: ds.length*G.K/G.N, xexp: xs.length*G.XK/G.XN };
}
function numDetail(n){
  let last=null, maxGap=0, prev=-1, cnt=0;
  draws.forEach((r,i)=>{ if (r.n.includes(n)){ cnt++; maxGap = Math.max(maxGap, prev>=0 ? i-prev-1 : i); prev=i; last=r.d; } });
  return { cnt, last, maxGap, cur: prev<0?draws.length:draws.length-1-prev };
}
let sumQ = [0,0];
function sumRange(){ const s = draws.map(r=>r.n.reduce((a,b)=>a+b,0)).sort((a,b)=>a-b); sumQ = [s[Math.floor(s.length*.1)], s[Math.floor(s.length*.9)]]; }

/* ---------- weekday stats ---------- */
const dayOf = d => dObj(d).getDay();
function dayStats(wd){
  const ds = draws.filter(r=>dayOf(r.d)===wd);
  const f = Array(G.N+1).fill(0); ds.forEach(r=>r.n.forEach(n=>f[n]++));
  const xs = ds.filter(r=>r.d>=G.xFrom); const xf = Array(G.XN+G.xMin).fill(0); xs.forEach(r=>r.x.forEach(n=>xf[n]++));
  const rec = ds.slice(-60); const rf = Array(G.N+1).fill(0); rec.forEach(r=>r.n.forEach(n=>rf[n]++));
  return { wd, ds, f, xs, xf, rf, exp: ds.length*G.K/G.N, xexp: xs.length*G.XK/G.XN };
}
function dayTest(){
  const from = G.key==='ej' ? 20220325 : 0;
  const rows = G.days.map(wd => { const f=Array(G.N).fill(0); draws.filter(r=>r.d>=from&&dayOf(r.d)===wd).forEach(r=>r.n.forEach(n=>f[n-1]++)); return f; });
  const rt = rows.map(r=>r.reduce((a,b)=>a+b,0)), tot = rt[0]+rt[1];
  let x=0; for (let j=0;j<G.N;j++){ const ct=rows[0][j]+rows[1][j]; for (let i=0;i<2;i++){ const e=rt[i]*ct/tot; if (e>0) x+=(rows[i][j]-e)**2/e; } }
  return { x, df:G.N-1, p:gammaQ((G.N-1)/2, x/2), n: rt.map(v=>v/G.K) };
}

/* ---------- popularity model (estimate) ---------- */
const POP_LUCKY = new Set([3,7,9,11,17,19]);
function numPop(n){ let w=1; if (n<=31) w+=0.55; if (n<=12) w+=0.25; if (POP_LUCKY.has(n)) w+=0.35; if (n===13) w-=0.15; if (n%10===0) w+=0.05; return w; }
function comboPop(nums){
  const s=[...nums].sort((a,b)=>a-b); let p=s.reduce((a,n)=>a+numPop(n),0)/s.length;
  let run=1, maxRun=1, pairs=0; for (let i=1;i<s.length;i++){ if (s[i]-s[i-1]===1){ run++; pairs++; } else run=1; maxRun=Math.max(maxRun,run); }
  if (maxRun>=3) p+=0.25*(maxRun-2); if (pairs>=2) p+=0.08*pairs;
  const diffs=s.slice(1).map((v,i)=>v-s[i]); if (diffs.every(d=>d===diffs[0])) p+=0.9;
  if (new Set(s.map(n=>n%10)).size<=2) p+=0.25;
  if (G.key==='lo'){ const rows={},cols={},d1={},d2={}; s.forEach(n=>{ const r=Math.floor((n-1)/7), c=(n-1)%7; rows[r]=(rows[r]||0)+1; cols[c]=(cols[c]||0)+1; d1[r-c]=(d1[r-c]||0)+1; d2[r+c]=(d2[r+c]||0)+1; });
    const mx=Math.max(...Object.values(rows),...Object.values(cols),...Object.values(d1),...Object.values(d2)); if (mx>=3) p+=0.18*(mx-2); }
  if (s.every(n=>n<=31)) p+=0.2;
  const ov = Math.max(0,...draws.slice(-6).map(r=>r.n.filter(n=>s.includes(n)).length)); if (ov>=3) p+=0.25*(ov-2);
  return Math.max(0, Math.min(100, Math.round((p-1.0)/1.2*100)));
}

/* ---------- generator ---------- */
function pickWeighted(r, pool, weights, k){
  const out=[]; const p=[...pool], w=[...weights];
  for (let j=0;j<k;j++){ const tot=w.reduce((a,b)=>a+b,0); let x=r()*tot, i=0; for (;i<p.length-1;i++){ x-=w[i]; if (x<=0) break; } out.push(p[i]); p.splice(i,1); w.splice(i,1); }
  return out.sort((a,b)=>a-b);
}
function genTips(strategy, drawDate, count=5){
  const r = rng(`${G.key}|${drawDate}|${strategy}|${reroll}`);
  const st = stats(100);
  const pool = Array.from({length:G.N},(_,i)=>i+1), xpool = Array.from({length:G.XN},(_,i)=>i+G.xMin);
  let w, xw;
  if (strategy==='day'){ const ds = dayStats(dayOf(drawDate)); const sdv=Math.sqrt(ds.exp)||1, rmean=ds.rf.reduce((a,b)=>a+b,0)/G.N, rsd=Math.sqrt(rmean)||1;
    w = pool.map(n=>Math.exp(0.45*(ds.f[n]-ds.exp)/sdv + 0.35*(ds.rf[n]-rmean)/rsd)*Math.pow(numPop(n),-2.5));
    xw = xpool.map(n=>Math.exp(0.4*((ds.xf[n]-ds.xexp)/(Math.sqrt(ds.xexp)||1)))); }
  else if (strategy==='anti'){ w = pool.map(n=>Math.pow(numPop(n),-3)); xw = xpool.map(n=> G.key==='ej' ? (n>=8?1.25:n===7?0.8:1) : 1); }
  else if (strategy==='hot'){ w = pool.map(n=>Math.pow(st.f[n]+1,2)); xw = xpool.map(n=>Math.pow(st.xf[n]+1,1.5)); }
  else if (strategy==='cold'){ w = pool.map(n=>Math.pow(st.gap[n]+1,1.3)); xw = xpool.map(n=>Math.pow(st.xgap[n]+1,1.2)); }
  else { w = pool.map(()=>1); xw = xpool.map(()=>1); }
  const tips=[], used=new Set(), past=new Set(draws.map(d=>d.n.join(',')));
  const smart = strategy==='anti' || strategy==='day';
  for (let tt=0;tt<count;tt++){
    let best=null, bestScore=1e9;
    for (let a=0;a<4000;a++){
      const n = pickWeighted(r,pool,w,G.K); const key=n.join(','); if (used.has(key)||past.has(key)) continue;
      const sum=n.reduce((x,y)=>x+y,0), odd=n.filter(x=>x%2).length, pop=comboPop(n);
      let ok=true;
      if (strategy!=='random'){
        if (sum<sumQ[0]||sum>sumQ[1]) ok=false;
        if (odd===0||odd===G.K) ok=false;
        let run=1; for (let i=1;i<n.length;i++){ run = n[i]-n[i-1]===1 ? run+1 : 1; if (run>=3) ok=false; }
      }
      if (smart){ if (n.filter(x=>x>31).length < Math.ceil(G.K/2)) ok=false; if (pop>(strategy==='day'?26:22)) ok=false;
        if (tips.some(tp=>tp.n.filter(x=>n.includes(x)).length>=3)) ok=false; }
      if (!ok) continue;
      const sc = strategy==='anti' ? pop : strategy==='day' ? pop*0.5 - n.reduce((s2,v)=>s2+Math.log(w[v-1]),0) : 0;
      if (sc<bestScore){ best=n; bestScore=sc; }
      if (best && (!smart || a>60)) break;
    }
    if (!best) best = pickWeighted(r,pool,w,G.K);
    used.add(best.join(','));
    const x = pickWeighted(r,xpool,xw,G.XK);
    tips.push({ n:best, x, pop:comboPop(best) });
    best.forEach(v=>{ w[v-1]*=0.35; }); x.forEach(v=>{ xw[v-G.xMin]*=0.6; });
  }
  return tips;
}

/* ---------- next draw ---------- */
function nextDraw(now=new Date()){
  for (let i=0;i<9;i++){
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate()+i);
    if (!G.days.includes(d.getDay())) continue;
    let h, m; if (G.key==='ej'){ h=21; m=0; } else { h = d.getDay()===3 ? 18 : 19; m = 25; }
    const at = new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m);
    if (at.getTime() + 3600e3 > now.getTime()) return at;
  }
}
const followingDraw = at => nextDraw(new Date(at.getTime() + 2*3600e3));

      <dt>${t('dPop')}</dt><dd>${numPop(n)>=1.8?t('high'):numPop(n)>=1.4?t('mid'):t('low')}</dd>
    </dl>
    <div class="toplists">
      <div><h4>${t('tMost')}</h4>${ballsHTML(sorted(st.f,true),null,true)}</div>
      <div><h4>${t('tLeast')}</h4>${ballsHTML(sorted(st.f,false),null,true)}</div>
      <div><h4>${t('tGap')}</h4>${ballsHTML(sorted(st.gap,true),null,true)}</div>
      <div><h4>${t('tX',{x:xName()})}</h4><div class="balls">${xs.map(x=>ball(x,G.xCls,true)).join('')}</div></div>
    </div>
    <p class="note" style="margin:14px 0 0">${t('normalDev',{ n:fmtInt(st.ds.length), pct:fmtNum(2*Math.sqrt(st.ds.length*(G.K/G.N)*(1-G.K/G.N))/st.exp*100,0) })}</p>`;
}

/* ---------- patterns ---------- */
function barChart(title, desc, labels, obs, theo){
  const max = Math.max(...obs, ...theo, 0.0001);
  const bars = labels.map((l,i)=>`<div class="b" title="${l}: ${fmtNum(obs[i]*100,1)} % (${t('theory')} ${fmtNum(theo[i]*100,1)} %)"><div class="o" style="height:${obs[i]/max*100}%"></div><div class="t" style="bottom:${theo[i]/max*100}%"></div></div>`).join('');
  return `<div class="panel chart"><h3>${title}</h3><p>${desc}</p><div class="bars">${bars}</div><div class="labs">${labels.map(l=>`<span>${l}</span>`).join('')}</div>
    <div class="keyrow"><span><i style="background:var(--teal)"></i>${t('observed')}</span><span><i style="background:var(--amber)"></i>${t('theory')}</span></div></div>`;
}
const hyper = (N, A, K, k) => C(A,k)*C(N-A,K-k)/C(N,K);
function renderPatterns(){
  const n=draws.length, K=G.K, N=G.N, ks = Array.from({length:K+1},(_,i)=>i);
  const oddObs = Array(K+1).fill(0); draws.forEach(r=>oddObs[r.n.filter(x=>x%2).length]++);
  const lowObs = Array(K+1).fill(0); draws.forEach(r=>lowObs[r.n.filter(x=>x<=25).length]++);
  const pNoCons = C(N-K+1,K)/C(N,K);
  const consObs = draws.filter(r=>{ const s=[...r.n].sort((a,b)=>a-b); return s.some((v,i)=>i&&v-s[i-1]===1); }).length/n;
  const pRep = 1 - C(N-K,K)/C(N,K);
  const repObs = draws.slice(1).filter((r,i)=>r.n.some(x=>draws[i].n.includes(x))).length/(n-1);
  const sums = draws.map(r=>r.n.reduce((a,b)=>a+b,0)); const lo=Math.min(...sums), hi=Math.max(...sums);
  const bins=10, bw=Math.ceil((hi-lo+1)/bins); const sObs=Array(bins).fill(0); sums.forEach(s=>sObs[Math.min(bins-1,Math.floor((s-lo)/bw))]++);
  const mean = K*(N+1)/2, sd=Math.sqrt(K*(N+1)*(N-K)/12);
  const cdf = x => 0.5*(1+erf((x-mean)/(sd*Math.SQRT2)));
  const sTheo = sObs.map((_,i)=>cdf(lo+(i+1)*bw-0.5)-cdf(lo+i*bw-0.5));
  const c2 = chi2(stats(0).f.slice(1)), xs=stats(0), c2x = chi2(xs.xf.slice(G.xMin));
  $('patterns').innerHTML =
    `<div class="panel chart"><h3>${t('chiH')}</h3><p>${t('chiSub',{n:fmtInt(n)})}</p>
      <div class="verdict"><div class="p">p = ${fmtNum(c2.p,2)}</div><div class="note">${t('chiDf',{x:fmtNum(c2.x,1),df:c2.df})}<br>${c2.p>0.05?t('chiOk'):t('chiOdd')}</div></div>
      <div class="verdict" style="margin-top:16px"><div class="p">p = ${fmtNum(c2x.p,2)}</div><div class="note">${t('chiX',{x:xName(),n:fmtInt(xs.xs.length)})}<br>${c2x.p>0.05?t('chiXok'):t('chiXodd')}</div></div></div>` +
    barChart(t('oeH'), t('oeSub',{k:K}), ks, oddObs.map(v=>v/n), ks.map(k=>hyper(N,Math.ceil(N/2),K,k))) +
    barChart(t('lhH'), t('lhSub'), ks, lowObs.map(v=>v/n), ks.map(k=>hyper(N,25,K,k))) +
    barChart(t('sumH'), t('sumSub',{a:sumQ[0],b:sumQ[1]}), sObs.map((_,i)=>lo+i*bw), sObs.map(v=>v/n), sTheo) +
    barChart(t('consH'), t('consSub'), L().consL, [consObs,1-consObs,repObs,1-repObs], [1-pNoCons,pNoCons,pRep,1-pRep]);
}

/* ---------- odds + calculator ---------- */
function oddsRows(){
  if (G.key==='ej'){
    const cls=[[5,2],[5,1],[5,0],[4,2],[4,1],[4,0],[3,2],[2,2],[3,1],[3,0],[1,2],[2,1]];
    return cls.map(([k,e])=>({ label:L().clsEJ(k,e), p: C(5,k)*C(45,5-k)/C(50,5) * C(2,e)*C(10,2-e)/C(12,2) }));
  }
  const cls=[[6,1],[6,0],[5,1],[5,0],[4,1],[4,0],[3,1],[3,0],[2,1]];
  return cls.map(([k,s])=>({ label:L().clsLO(k,s), p: C(6,k)*C(43,6-k)/C(49,6) * (s?0.1:0.9) }));
}
const pctFmt = v => (v*100).toLocaleString(L().loc,{maximumSignificantDigits:3,maximumFractionDigits:12}) + ' %';
function renderOdds(){
  const rows = oddsRows(), any = rows.reduce((a,r)=>a+r.p,0);
  $('oddsSub').textContent = G.key==='ej' ? t('oddsSubEJ',{n:fmtInt(C(50,5)*C(12,2))}) : t('oddsSubLO',{n:fmtInt(C(49,6)*10)});
  $('odds').innerHTML = `<thead><tr><th>${t('thClass')}</th><th>${t('thHits')}</th><th class="r">${t('thOdds')}</th><th class="r">${t('thProb')}</th><th class="r">${t('thEvery')}</th></tr></thead><tbody>` +
    rows.map((r,i)=>{ const yrs = 1/r.p/104; return `<tr><td>${i+1}</td><td>${r.label}</td><td class="r">${fmtInt(1/r.p)}</td><td class="r">${pctFmt(r.p)}</td><td class="r">${yrs<1?t('weeks',{n:fmtInt(yrs*52)}):t('years',{n:fmtInt(yrs)})}</td></tr>`; }).join('') +
    `<tr><td></td><td><b>${t('anyWin')}</b></td><td class="r"><b>${fmtNum(1/any,1)}</b></td><td class="r"><b>${fmtNum(any*100,2)} %</b></td><td></td></tr></tbody>`;
}
function renderCalc(){
  const tips = +$('cTips').value, nd = +$('cDraws').value, price = parseFloat(String($('cPrice').value).replace(',','.')) || 0;
  $('cTipsV').textContent = tips; $('cDrawsV').textContent = nd;
  const rows = oddsRows(), jp = rows[0].p, any = rows.reduce((a,r)=>a+r.p,0), n = tips*nd;
  const pJP = 1 - Math.pow(1 - jp*tips, nd), pAny = 1 - Math.pow(1-any, n);
  const pBig = 1 - Math.pow(1 - rows.slice(0,5).reduce((a,r)=>a+r.p,0), n);
  const cost = n*price, eur = v => v.toLocaleString(L().loc,{style:'currency',currency:'EUR'});
  const pc = v => v<0.001 ? pctFmt(v) : fmtNum(v*100,1)+' %';
  const box = (big, label) => `<div><div style="font-size:24px;font-weight:800;font-stretch:112%">${big}</div><div class="note">${label}</div></div>`;
  $('calcOut').innerHTML = box(pc(pJP), t('cJP',{n:fmtInt(1/pJP)})) + box(pc(pBig), t('cBig')) + box(pc(pAny), t('cAny')) +
    box(`${fmtInt(n*any)}×`, t('cSmall')) + box(eur(cost), t('cCost',{n:fmtInt(n)})) + box('≈ '+eur(cost*0.5), t('cBack'));
}

/* ---------- ticket check ---------- */
let tSel = new Set(), tX = new Set();
function renderTicket(){
  $('ticket').style.gridTemplateColumns = `repeat(${G.cols},minmax(0,1fr))`;
  $('ticket').innerHTML = Array.from({length:G.N},(_,i)=>`<button data-n="${i+1}" aria-pressed="${tSel.has(i+1)}">${i+1}</button>`).join('');
  $('ticketX').style.gridTemplateColumns = `repeat(${G.XN},minmax(0,1fr))`;
  $('ticketX').innerHTML = Array.from({length:G.XN},(_,i)=>`<button data-n="${i+G.xMin}" aria-pressed="${tX.has(i+G.xMin)}">${i+G.xMin}</button>`).join('');
  $('extraLabel').textContent = t('pickX',{x:xName(),k:G.XK});
  renderCheck();
}
function renderCheck(){
  const n=[...tSel].sort((a,b)=>a-b), x=[...tX].sort((a,b)=>a-b);
  if (n.length<G.K){ const r=G.K-n.length; $('checkOut').innerHTML = `<h3 style="margin:0 0 8px">${t('pickMore',{n:r,pl:r===1?'':t('pickMorePl')})}</h3><p class="note">${t('pickHint')}</p>`; return; }
  const pop = comboPop(n), hits = Array(G.K+1).fill(0); let exact=null, best={c:-1};
  const xok = x.length===G.XK;
  draws.forEach(r=>{ const c=r.n.filter(v=>n.includes(v)).length; hits[c]++; const xc = r.d>=G.xFrom && xok ? r.x.filter(v=>x.includes(v)).length : 0; if (c===G.K && (!xok || xc===G.XK)) exact=r.d; if (c*10+xc>best.c) best={c:c*10+xc, d:r.d, k:c, xk:xc}; });
  const sum=n.reduce((a,b)=>a+b,0), notes=[];
  if (n.every(v=>v<=31)) notes.push(t('nAll31'));
  if (n.some(v=>POP_LUCKY.has(v))) notes.push(t('nLucky'));
  if (sum<sumQ[0]||sum>sumQ[1]) notes.push(t('nSum',{sum,a:sumQ[0],b:sumQ[1]}));
  if (draws.some(r=>r.n.join()===n.join())) notes.push(t('nPast'));
  $('checkOut').innerHTML = `<h3 style="margin:0 0 10px">${t('yourTip')}</h3>${ballsHTML(n, xok?x:null)}
    <div class="pop" style="text-align:left;margin:16px 0;max-width:260px"><span>${t('estPop')}</span><b>${pop} / 100</b><i><s style="width:${pop}%"></s></i></div>
    <p class="note" style="margin:0 0 12px">${pop<=20?t('popLow'):pop<=45?t('popMid'):t('popHigh')}</p>
    <table><thead><tr><th>${t('hitsIn',{n:fmtInt(draws.length)})}</th><th class="r">${t('count')}</th></tr></thead><tbody>
    ${hits.map((h,i)=>({h,i})).reverse().filter(o=>o.i>=2).map(o=>`<tr><td>${t('hitsRow',{k:o.i})}</td><td class="r">${o.h}</td></tr>`).join('')}</tbody></table>
    <p class="note" style="margin:12px 0 0">${t('bestHit',{k:best.k, x: xok&&best.d>=G.xFrom?` + ${best.xk} ${xName()}`:'', date:fmtD(best.d)})}${exact?t('fullHit',{date:fmtD(exact)}):''}</p>
    ${notes.length?`<ul class="note" style="margin:12px 0 0;padding-left:18px">${notes.map(s=>`<li>${s}</li>`).join('')}</ul>`:''}`;
}

/* ---------- archive ---------- */
function renderArchive(){
  $('archSub').textContent = t('archSub',{ n:fmtInt(draws.length), first:fmtD(draws[0].d) });
  $('addNums').placeholder = t(G.key==='ej'?'phEJ':'phLO');
  const rows = draws.slice(-archShown).reverse();
  $('arch').innerHTML = `<thead><tr><th>${t('thDate')}</th><th>${t('thNums')}</th><th class="r">${t('thSum')}</th><th></th></tr></thead><tbody>` +
    rows.map(r=>`<tr><td>${L().WS[dayOf(r.d)]}, ${fmtD(r.d)}</td><td>${ballsHTML(r.n, r.x, true)}</td><td class="r">${r.n.reduce((a,b)=>a+b,0)}</td><td class="r">${r.user?`<button class="btn" data-del="${r.d}" style="padding:4px 8px;font-size:12px">${t('remove')}</button>`:''}</td></tr>`).join('') + '</tbody>';
  $('more').style.display = archShown >= draws.length ? 'none' : '';
}
function addDraw(){
  const dv = $('addDate').value, msg = $('addMsg');
  const parts = $('addNums').value.split('+'); const n = (parts[0]||'').match(/\d+/g)?.map(Number) || []; const x = (parts[1]||'').match(/\d+/g)?.map(Number) || [];
  if (!dv) { msg.textContent = t('errDate'); return; }
  if (n.length!==G.K || new Set(n).size!==G.K || n.some(v=>v<1||v>G.N)) { msg.textContent = t('errNums',{k:G.K,n:G.N}); return; }
  if (x.length!==G.XK || x.some(v=>v<G.xMin||v>G.XN-1+G.xMin)) { msg.textContent = t(G.key==='ej'?'errXEJ':'errXLO'); return; }
  const d = +dv.replace(/-/g,'');
  const arr = loadUser().filter(r=>r.d!==d); arr.push({ d, n:n.sort((a,b)=>a-b), x:x.sort((a,b)=>a-b) }); saveUser(arr);
  $('addNums').value=''; refresh(); msg.textContent = t('saved',{date:fmtD(d)});
}

/* ---------- wiring ---------- */
function refresh(){
  applyStatic(); buildDraws(); sumRange(); renderHero(); renderLive(); renderDays(); renderCalc(); renderHeat(); renderPatterns(); renderOdds(); renderTicket(); renderArchive();
  $('dataStand').textContent = t('dataStand',{ ej:fmtD(SNAP.ej), lo:fmtD(SNAP.lo) });
  tick();
}
function setGame(k){
  G = GAMES[k]; tgt = 0; $('cPrice').value = G.price; tSel.clear(); tX.clear(); selNum = 1; archShown = 25; reroll = 0;
  $('gEJ').setAttribute('aria-pressed', k==='ej'); $('gLO').setAttribute('aria-pressed', k==='lo');
  document.title = `AYKS Analyser – ${G.name}`;
  try { localStorage.setItem('zl-game', k); } catch(e){}
  refresh();
}
function setLang(l){ LANG = l; try { localStorage.setItem('ayks-lang', l); } catch(e){} refresh(); }
$('lDE').onclick = () => setLang('de'); $('lTR').onclick = () => setLang('tr');
$('gEJ').onclick = () => setGame('ej'); $('gLO').onclick = () => setGame('lo');
$('strategy').onchange = () => { reroll = 0; renderPicks(); };
$('tgt0').onclick = () => { tgt=0; reroll=0; renderPicks(); };
$('tgt1').onclick = () => { tgt=1; reroll=0; renderPicks(); };
['cTips','cDraws','cPrice'].forEach(id=>$(id).addEventListener('input', renderCalc));
$('reroll').onclick = () => { reroll++; renderPicks(); };
$('copyTips').onclick = async () => {
  const txt = `${G.name}, ${fmtD(dInt(draws2[tgt]))}\n` + curTips.map((tp,i)=>`${i+1}) ${tp.n.join(' ')} + ${tp.x.join(' ')}`).join('\n');
  try { await navigator.clipboard.writeText(txt); $('copyTips').textContent=t('copied'); } catch(e){ $('copyTips').textContent=t('copyFail'); }
  setTimeout(()=>$('copyTips').textContent=t('copy'),1500);
};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ heatMode=b.dataset.mode; document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b)); renderHeat(); });
$('win').onchange = renderHeat;
$('heat').onclick = e => { const b=e.target.closest('.cell'); if (!b) return; selNum=+b.dataset.n; renderHeat(); };
$('ticket').onclick = e => { const b=e.target.closest('button'); if (!b) return; const n=+b.dataset.n; if (tSel.has(n)) tSel.delete(n); else if (tSel.size<G.K) tSel.add(n); renderTicket(); };
$('ticketX').onclick = e => { const b=e.target.closest('button'); if (!b) return; const n=+b.dataset.n; if (tX.has(n)) tX.delete(n); else { if (tX.size>=G.XK) tX.delete([...tX][0]); tX.add(n); } renderTicket(); };
$('clearTicket').onclick = () => { tSel.clear(); tX.clear(); renderTicket(); };
$('fillFromTip').onclick = () => { tSel = new Set(curTips[0].n); tX = new Set(curTips[0].x); renderTicket(); };
$('more').onclick = () => { archShown += 50; renderArchive(); };
$('arch').onclick = e => { const b=e.target.closest('[data-del]'); if (!b) return; saveUser(loadUser().filter(r=>r.d!==+b.dataset.del)); refresh(); };
$('addBtn').onclick = addDraw;
function tick(){
  if (!curDraw) return; let s = Math.max(0, Math.floor((curDraw - new Date())/1000));
  if (s===0 && new Date() - curDraw > 3600e3) { renderHero(); return; }
  const d=Math.floor(s/86400); s%=86400; const h=Math.floor(s/3600); s%=3600; const m=Math.floor(s/60); s%=60;
  $('countdown').innerHTML = [[d,'days'],[h,'hrs'],[m,'mins'],[s,'secs']].map(([v,l])=>`<div><b>${String(v).padStart(2,'0')}</b><span>${t(l)}</span></div>`).join('');
}

/* ================= INTRO ================= */
function runIntro(){
  const intro = $('intro'), reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // title letters
  const mk = (el, txt, d0) => { el.innerHTML = [...txt].map((c,i)=>`<span style="animation-delay:${d0+i*70}ms">${c}</span>`).join(''); };
  mk($('tAyks'), 'AYKS', 250); mk($('tAn'), 'ANALYSER', 750);
  // chart: bars + rising line
  const pts = [], W=640, H=230, nB=14; let v = 0.18;
  const r = rng('ayks-intro');
  for (let i=0;i<nB;i++){ v = Math.min(0.95, Math.max(0.1, v + (r()-0.32)*0.16)); pts.push(v); }
  pts[nB-1] = 0.92;
  const bw = W/nB;
  $('introBars').innerHTML = pts.map((p,i)=>`<rect class="bar" x="${i*bw+bw*0.22}" y="${H-p*H*0.78}" width="${bw*0.56}" height="${p*H*0.78}" rx="4" fill="url(#ib)" style="animation-delay:${80+i*55}ms"/>`).join('');
  const xy = pts.map((p,i)=>[i*bw+bw/2, H-p*H*0.86-6]);
  let dPath = `M${xy[0][0]},${xy[0][1]}`; for (let i=1;i<xy.length;i++){ const [x0,y0]=xy[i-1],[x1,y1]=xy[i], cx=(x0+x1)/2; dPath += ` C${cx},${y0} ${cx},${y1} ${x1},${y1}`; }
  $('introLine').setAttribute('d', dPath);
  $('introArea').setAttribute('d', dPath + ` L${xy[xy.length-1][0]},${H} L${xy[0][0]},${H} Z`);
  const [ex,ey] = xy[xy.length-1];
  ['introDot','introPulse'].forEach(id=>{ $(id).setAttribute('cx',ex); $(id).setAttribute('cy',ey); });
  // counters
  const total = RAW.ej.length + RAW.lo.length, nums = RAW.ej.length*7 + RAW.lo.length*7;
  const cnt = (el, to, delay) => { const t0 = performance.now()+delay; const step = now => { const k = Math.min(1, Math.max(0,(now-t0)/1300)); el.textContent = Math.round(to*(1-Math.pow(1-k,3))).toLocaleString(L().loc); if (k<1) requestAnimationFrame(step); }; requestAnimationFrame(step); };
  cnt($('icDraws'), total, 1900); cnt($('icNums'), nums, 2000); cnt($('icTests'), 6, 2100);
  // lotto balls of the latest draws
  const le = RAW.ej[RAW.ej.length-1], ll = RAW.lo[RAW.lo.length-1];
  $('introBalls').innerHTML = le.slice(1,6).map((n,i)=>`<span class="ball main-ej sm" style="animation-delay:${2500+i*90}ms">${n}</span>`).join('') +
    le.slice(6).map((n,i)=>`<span class="ball euro sm" style="animation-delay:${2950+i*90}ms">${n}</span>`).join('') +
    `<span style="width:14px"></span>` + ll.slice(1,7).map((n,i)=>`<span class="ball lotto sm" style="animation-delay:${3150+i*90}ms">${n}</span>`).join('');
  // money rain
  if (!reduced){
    const money = $('money'); let html='';
    for (let i=0;i<26;i++){ const s=26+r()*26; html += `<div class="coin" style="left:${r()*100}%;--s:${s}px;--d:${2.6+r()*2.2}s;--delay:${0.3+r()*2.6}s;--dx:${(r()-0.5)*160}px;--rz:${(r()-0.5)*720}deg">€</div>`; }
    for (let i=0;i<9;i++){ html += `<div class="note-bill" style="left:${r()*95}%;--d:${3.4+r()*2}s;--delay:${0.6+r()*2.4}s;--dx:${(r()-0.5)*260}px">€</div>`; }
    money.innerHTML = html;
  }
  const dur = reduced ? 1200 : 5200;
  intro.style.setProperty('--dur', dur+'ms');
  let done = false;
  const close = () => { if (done) return; done = true; intro.classList.add('out'); setTimeout(()=>intro.remove(), 900); };
  $('skip').onclick = close;
  intro.addEventListener('click', e => { if (e.target === intro) close(); });
  addEventListener('keydown', e => { if (e.key==='Escape' || e.key==='Enter') close(); }, { once:true });
  setTimeout(close, dur);
}

let start = 'ej'; try { start = localStorage.getItem('zl-game') || 'ej'; } catch(e){}
setGame(GAMES[start] ? start : 'ej');
runIntro();
setInterval(tick, 1000);
liveUpdate();
setInterval(() => { if (liveState === 'ok') liveUpdate(); }, 30*60*1000);
window.__tips = (i) => { tgt=i||0; renderPicks(); return { game:G.key, date:dInt(draws2[tgt]), tips:curTips }; };
window.__setLang = setLang;
})();
